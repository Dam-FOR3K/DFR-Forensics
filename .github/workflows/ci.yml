name: DFR-Forensics CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Test Suite (pytest)
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        python -m pytest tests/ -v --tb=short | Tee-Object -FilePath pytest_output.log

    - name: Publish Test Summary
      if: always()
      run: |
        if (Test-Path pytest_output.log) {
          Get-Content pytest_output.log | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
        }

    - name: Post Failure Comment
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let log = 'No log';
          if (fs.existsSync('pytest_output.log')) {
            log = fs.readFileSync('pytest_output.log', 'utf8');
          }
          await github.rest.repos.createCommitComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            commit_sha: context.sha,
            body: '```\n' + log.slice(-3000) + '\n```'
          });

    - name: Validate Technical Whitepapers Generation
      run: |
        python scripts/generate_whitepapers.py

